<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="1" stop-color="#10192a"/>
    </linearGradient>
    <radialGradient id="massA">
      <stop offset="0" stop-color="#fff4bd"/>
      <stop offset="0.45" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#9b4d25"/>
    </radialGradient>
    <radialGradient id="massB">
      <stop offset="0" stop-color="#dff8ff"/>
      <stop offset="0.45" stop-color="#54d6ff"/>
      <stop offset="1" stop-color="#176a9a"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#eaf7ff"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="1196" height="296" rx="22" fill="url(#panel)" stroke="#31506d" stroke-width="4"/>

  <circle cx="118" cy="145" r="44" fill="url(#massA)"/>
  <circle cx="332" cy="145" r="26" fill="url(#massB)"/>
  <line x1="168" y1="145" x2="296" y2="145" stroke="#eaf7ff" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="302" y1="194" x2="148" y2="194" stroke="#7995ad" stroke-width="2"/>
  <line x1="148" y1="185" x2="148" y2="203" stroke="#7995ad" stroke-width="2"/>
  <line x1="302" y1="185" x2="302" y2="203" stroke="#7995ad" stroke-width="2"/>
  <text x="225" y="224" text-anchor="middle" fill="#9fc8df" font-family="DejaVu Sans, sans-serif" font-size="25">rᵢⱼ</text>
  <text x="118" y="88" text-anchor="middle" fill="#ffc978" font-family="DejaVu Sans, sans-serif" font-size="24">mᵢ</text>
  <text x="332" y="103" text-anchor="middle" fill="#82e5ff" font-family="DejaVu Sans, sans-serif" font-size="24">mⱼ</text>

  <line x1="390" y1="34" x2="390" y2="266" stroke="#31506d" stroke-width="2"/>
  <text x="650" y="92" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="40">aᵢⱼ = G · mⱼ / max(rᵢⱼ², dₘᵢₙ²) · r̂ᵢⱼ</text>
  <text x="650" y="159" text-anchor="middle" fill="#76ddff" font-family="DejaVu Sans, sans-serif" font-size="42">aᵢ = Σⱼ≠ᵢ aᵢⱼ</text>
  <text x="650" y="221" text-anchor="middle" fill="#aebfd0" font-family="DejaVu Sans, sans-serif" font-size="28">vₙ₊₁ = vₙ + aₙΔt</text>
  <text x="650" y="258" text-anchor="middle" fill="#aebfd0" font-family="DejaVu Sans, sans-serif" font-size="28">xₙ₊₁ = xₙ + vₙ₊₁Δt</text>

  <line x1="906" y1="34" x2="906" y2="266" stroke="#31506d" stroke-width="2"/>
  <text x="1053" y="72" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="27">N(N−1)</text>
  <text x="1053" y="108" text-anchor="middle" fill="#8ea8bc" font-family="DejaVu Sans, sans-serif" font-size="19">PAIR EVALUATIONS</text>
  <text x="1053" y="160" text-anchor="middle" fill="#76ddff" font-family="DejaVu Sans, sans-serif" font-size="25">16,384 → 268 M</text>
  <text x="1053" y="202" text-anchor="middle" fill="#ffb96b" font-family="DejaVu Sans, sans-serif" font-size="25">65,536 → 4.29 B</text>
  <g transform="translate(962 226)">
    <rect x="0" y="0" width="12" height="27" fill="#aebfd0"/>
    <rect x="20" y="9" width="12" height="18" fill="#aebfd0"/>
    <text x="41" y="22" fill="#aebfd0" font-family="DejaVu Sans, sans-serif" font-size="17">CPU</text>
    <rect x="90" y="0" width="8" height="8" fill="#76ddff"/>
    <rect x="102" y="0" width="8" height="8" fill="#76ddff"/>
    <rect x="114" y="0" width="8" height="8" fill="#76ddff"/>
    <rect x="90" y="12" width="8" height="8" fill="#76ddff"/>
    <rect x="102" y="12" width="8" height="8" fill="#76ddff"/>
    <rect x="114" y="12" width="8" height="8" fill="#76ddff"/>
    <text x="131" y="18" fill="#76ddff" font-family="DejaVu Sans, sans-serif" font-size="17">GPU</text>
  </g>
</svg>
